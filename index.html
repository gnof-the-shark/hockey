<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canadiens de Montréal — Matchs & live FR</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Canadiens de Montréal</h1>
      <p class="subtitle">Calendrier des matchs et accès live stream en français.</p>

      <section class="panel">
        <div class="panel-header">
          <h2>Matchs</h2>
          <button id="refresh-btn" type="button">Actualiser</button>
        </div>
        <p id="status" class="status">Chargement des données...</p>
        <ul id="games-list" class="games-list"></ul>
      </section>

      <section class="panel">
        <h2>Live stream en français</h2>
        <p>
          Sélectionne une source. Note : Les liens officiels s'ouvriront dans un nouvel onglet car ils bloquent l'intégration directe.
        </p>
        <div class="stream-controls">
          <select id="stream-select" aria-label="Source de live stream">
            <option value="https://www.rds.ca/en-direct">RDS (Officiel - Abonnement requis)</option>
            <option value="https://www.tvasports.ca/en-direct">TVA Sports (Officiel - Abonnement requis)</option>
            <option value="https://gem.cbc.ca/live">CBC Gem (Gratuit - Samedi/Séries)</option>
            <option value="iframe-source">Source Externe (Test)</option>
          </select>
          <button id="open-stream-btn" type="button">Lancer le flux</button>
        </div>
        
        <div id="video-container" style="display:none; margin-top: 20px;">
             <iframe 
                id="stream-frame" 
                width="100%" 
                height="460" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
