<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canadiens de Montréal — Matchs & live FR</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Canadiens de Montréal</h1>
      <p class="subtitle">Calendrier des matchs et accès live stream en français.</p>

      <section class="panel">
        <div class="panel-header">
          <h2>Matchs</h2>
          <button id="refresh-btn" type="button">Actualiser</button>
        </div>
        <p id="status" class="status">Chargement…</p>
        <ul id="games-list" class="games-list"></ul>
      </section>

      <section class="panel">
        <h2>Live stream en français</h2>
        <p>
          Sélectionne une source officielle puis ouvre le flux. Certains diffuseurs bloquent
          l’affichage intégré et demandent l’ouverture dans un nouvel onglet.
        </p>
        <div class="stream-controls">
          <select id="stream-select" aria-label="Source de live stream">
            <option value="https://www.rds.ca/hockey/canadiens">RDS (officiel)</option>
            <option value="https://www.tvasports.ca/hockey/lnh/canadiens">TVA Sports (officiel)</option>
            <option value="https://www.nhl.com/fr/canadiens">NHL/Canadiens (officiel)</option>
          </select>
          <button id="open-stream-btn" type="button">Ouvrir le stream</button>
          <button id="cast-btn" type="button">Google Cast</button>
          <button id="apple-tv-btn" type="button">Apple TV</button>
        </div>
        <p id="stream-message" class="status"></p>
        <iframe
          id="stream-frame"
          title="Live stream du Canadien en français"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </section>
    </main>

    <script
      type="text/javascript"
      src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"
      async
    ></script>
    <script src="/script.js"></script>
  </body>
</html>
